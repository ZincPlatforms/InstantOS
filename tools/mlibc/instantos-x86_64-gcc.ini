[binaries]
c = '/home/sky/gcc-port/gcc-install/bin/x86_64-unknown-instantos-gcc'
cpp = '/home/sky/gcc-port/gcc-install/bin/x86_64-unknown-instantos-g++'
ar = '/home/sky/projects/InstantOS/build/binutils-cross/bin/x86_64-unknown-instantos-ar'
strip = '/home/sky/projects/InstantOS/build/binutils-cross/bin/x86_64-unknown-instantos-strip'

[host_machine]
system = 'instantos'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[built-in options]
# Build mlibc with the GCC cross-compiler. Like the clang cross-file this is a
# freestanding, self-contained build of the C library itself, so we avoid the
# sysroot's own (previously installed) libc: -nostdinc keeps GCC from pulling
# the installed mlibc headers (mlibc provides its own via -I and the
# freestnd-c-hdrs subproject), and -nostdlib keeps it from linking libc/crt.
c_args = ['-D_GNU_SOURCE', '-D__MLIBC_POSIX2024', '-ffreestanding', '-fno-stack-protector', '-fPIC', '-nostdinc']
cpp_args = ['-D_GNU_SOURCE', '-D__MLIBC_POSIX2024', '-ffreestanding', '-fno-stack-protector', '-fPIC', '-fno-exceptions', '-fno-rtti', '-nostdinc', '-nostdinc++']
c_link_args = ['-nostdlib']
cpp_link_args = ['-nostdlib']
default_library = 'shared'
